name: Update GitAscii

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: write

concurrency:
  group: gitascii-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (post-processing script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src

      - name: Generate and Publish GitAscii SVGs
        uses: Igorcbraz/GitAscii/action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gitascii branch
        uses: actions/checkout@v4
        with:
          ref: gitascii
          path: out

      - name: Make SVGs valid for GitHub
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 src/.github/scripts/fix_svg.py out/gitascii.json out/profiles/default/*.svg

      - name: Commit fixed SVGs
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles
          git diff --cached --quiet || (git commit -m "Fix GitAscii SVGs for GitHub rendering [skip ci]" && git push origin gitascii)
